server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
      client:
        registration:
          keycloak:
            client-id: billing-service
            client-secret: ${BILLING_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI}

tcc:
  security:
    enabled: true
    opa:
      enabled: true
      url: ${OPA_URL:http://localhost:8182/v1/data/billing/authz/decision}
      timeout: 2s
    headers:
      purpose: X-Purpose
      data-subject-id: X-Data-Subject-Id
      correlation-id: X-Correlation-Id

user-service:
  url: ${USER_SERVICE_URL}
